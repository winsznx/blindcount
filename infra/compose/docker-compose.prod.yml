services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blindcount
      POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in infra/compose/.env}"
      POSTGRES_DB: blindcount
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  migrate:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    env_file: ../../.env.production
    working_dir: /app/packages/db
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on: [db]
  api:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    env_file: ../../.env.production
    environment: { RUN_WORKER_IN_PROCESS: "false" }
    expose: ["4000"]
    volumes: [objects:/data]
    depends_on: [db, migrate]
    restart: unless-stopped
  worker:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    env_file: ../../.env.production
    command: ["npx", "tsx", "src/worker-main.ts"]
    volumes: [objects:/data]
    depends_on: [db, migrate]
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped
volumes:
  pgdata:
  objects:
  caddy_data:
  caddy_config:
